name: Autoroute signals only

on:
  workflow_dispatch:
  push:
    branches: [ai/autoroute-placement-test]
    paths: ['.github/workflows/autoroute-signals-only.yml']

permissions:
  contents: read

jobs:
  route:
    name: signals-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [u14_90, u14_270]
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad and Java
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download router
        run: |
          curl --fail --location --retry 5 --output freerouting.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.2.4/freerouting-2.2.4.jar
          echo 'f5ed374182900ccc78e473518bbb9f6b869f4a07159495f663a76f52bb10523b  freerouting.jar' | sha256sum --check
      - name: Prepare signal-only DSN
        shell: bash
        run: |
          set -euo pipefail
          root="out/${{ matrix.variant }}"
          mkdir -p "$root"
          python3 hardware/rev-a/tools/run_autoroute_placement_test.py \
            --input hardware/rev-a/openpocket-rev-a.kicad_pcb \
            --output "$root/placed.kicad_pcb" \
            --variant "${{ matrix.variant }}" \
            --report "$root/placement.json"
          python3 hardware/rev-a/tools/export_freerouting.py \
            --board "$root/placed.kicad_pcb" \
            --output "$root/board-full.dsn"
          python3 hardware/rev-a/tools/prepare_signal_only_dsn.py \
            --input "$root/board-full.dsn" \
            --output "$root/board.dsn"
      - name: Route signal nets
        shell: bash
        run: |
          set -euo pipefail
          root="out/${{ matrix.variant }}"
          java -Xms1g -Xmx12g -jar freerouting.jar \
            -de "$root/board.dsn" \
            -do "$root/board.ses" \
            -mp 40 -mt 0 \
            2>&1 | tee "$root/freerouting.log"
          test -s "$root/board.ses"
      - name: Import and audit
        shell: bash
        run: |
          set -euo pipefail
          root="out/${{ matrix.variant }}"
          python3 hardware/rev-a/tools/import_freerouting.py \
            "$root/board.ses" \
            --board "$root/placed.kicad_pcb" \
            --output "$root/routed-signals.kicad_pcb" \
            2>&1 | tee "$root/import.log"
          kicad-cli pcb drc \
            --output "$root/drc.rpt" \
            --severity-all --all-track-errors \
            "$root/routed-signals.kicad_pcb" || true
          python3 hardware/rev-a/tools/routing_audit.py \
            "$root/routed-signals.kicad_pcb" \
            --json "$root/routing-audit.json" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoroute-signals-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
