name: Placement DRC baseline

on:
  workflow_dispatch:
  push:
    branches: [ai/autoroute-placement-test]
    paths: ['.github/workflows/placement-drc-baseline.yml']

permissions:
  contents: read

jobs:
  check:
    name: placement-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [u14_90, u14_270]
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
      - name: Generate placement
        run: |
          root="out/${{ matrix.variant }}"
          mkdir -p "$root"
          python3 hardware/rev-a/tools/run_autoroute_placement_test.py \
            --input hardware/rev-a/openpocket-rev-a.kicad_pcb \
            --output "$root/placed.kicad_pcb" \
            --variant "${{ matrix.variant }}" \
            --report "$root/placement.json"
      - name: Run baseline DRC
        run: |
          root="out/${{ matrix.variant }}"
          kicad-cli pcb drc \
            --output "$root/drc.rpt" \
            --severity-all --all-track-errors \
            "$root/placed.kicad_pcb" || true
          python3 - "$root/drc.rpt" "$root/drc-counts.json" <<'PY'
          import collections, json, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          counts = collections.Counter(re.findall(r'^\[([^\]]+)\]:', text, re.M))
          pathlib.Path(sys.argv[2]).write_text(json.dumps(counts, indent=2) + '\n')
          print(json.dumps(counts, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placement-drc-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
