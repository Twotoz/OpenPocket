name: Autoroute placement test

on:
  workflow_dispatch:
  push:
    branches:
      - ai/autoroute-placement-test
    paths:
      - '.github/workflows/autoroute-placement-test.yml'
      - 'hardware/rev-a/**'

permissions:
  contents: read

jobs:
  autoroute:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [u14_90, u14_270]

    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4

      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version
          python3 - <<'PY'
          import pcbnew
          print('pcbnew', pcbnew.Version())
          PY

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Freerouting 2.2.4
        run: |
          curl --fail --location --retry 5 \
            --output freerouting.jar \
            https://github.com/freerouting/freerouting/releases/download/v2.2.4/freerouting-2.2.4.jar
          echo 'f5ed374182900ccc78e473518bbb9f6b869f4a07159495f663a76f52bb10523b  freerouting.jar' | sha256sum --check
          java -version

      - name: Generate corrected placement
        run: |
          mkdir -p "out/${{ matrix.variant }}"
          python3 hardware/rev-a/tools/autoroute_placement_test.py \
            --input hardware/rev-a/openpocket-rev-a.kicad_pcb \
            --output "out/${{ matrix.variant }}/placed.kicad_pcb" \
            --variant "${{ matrix.variant }}" \
            --report "out/${{ matrix.variant }}/placement.json" \
            2>&1 | tee "out/${{ matrix.variant }}/placement.log"

      - name: Pre-route DRC and DSN export
        run: |
          set +e
          kicad-cli pcb drc \
            --output "out/${{ matrix.variant }}/pre-route-drc.rpt" \
            --severity-all --all-track-errors \
            "out/${{ matrix.variant }}/placed.kicad_pcb"
          echo $? > "out/${{ matrix.variant }}/pre-route-drc.exit"
          set -e
          python3 hardware/rev-a/tools/export_freerouting.py \
            --board "out/${{ matrix.variant }}/placed.kicad_pcb" \
            --output "out/${{ matrix.variant }}/board.dsn"
          grep -A1 '(layer GND1' "out/${{ matrix.variant }}/board.dsn"
          grep -A1 '(layer GND2' "out/${{ matrix.variant }}/board.dsn"

      - name: Run constrained Freerouting
        run: |
          set +e
          /usr/bin/time -v java -Xms1g -Xmx12g -jar freerouting.jar \
            -de "out/${{ matrix.variant }}/board.dsn" \
            -do "out/${{ matrix.variant }}/board.ses" \
            2>&1 | tee "out/${{ matrix.variant }}/freerouting.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "out/${{ matrix.variant }}/freerouting.exit"
          set -e
          test -s "out/${{ matrix.variant }}/board.ses"

      - name: Import route and audit
        run: |
          python3 hardware/rev-a/tools/import_freerouting.py \
            "out/${{ matrix.variant }}/board.ses" \
            --board "out/${{ matrix.variant }}/placed.kicad_pcb" \
            --output "out/${{ matrix.variant }}/routed.kicad_pcb" \
            2>&1 | tee "out/${{ matrix.variant }}/import.log"

          set +e
          kicad-cli pcb drc \
            --output "out/${{ matrix.variant }}/drc.rpt" \
            --severity-all --all-track-errors \
            "out/${{ matrix.variant }}/routed.kicad_pcb"
          drc_status=$?
          echo "$drc_status" > "out/${{ matrix.variant }}/drc.exit"

          python3 hardware/rev-a/tools/routing_audit.py \
            "out/${{ matrix.variant }}/routed.kicad_pcb" \
            --json "out/${{ matrix.variant }}/routing-audit.json"
          audit_status=$?
          echo "$audit_status" > "out/${{ matrix.variant }}/routing-audit.exit"
          set -e

      - name: Summarize routing result
        if: always()
        run: |
          python3 - "out/${{ matrix.variant }}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          drc = (root / 'drc.rpt').read_text(errors='replace') if (root / 'drc.rpt').exists() else ''
          log = (root / 'freerouting.log').read_text(errors='replace') if (root / 'freerouting.log').exists() else ''
          audit = {}
          if (root / 'routing-audit.json').exists():
              audit = json.loads((root / 'routing-audit.json').read_text())

          unconnected = None
          for pattern in (
              r'Found\s+(\d+)\s+unconnected pads',
              r'Unconnected items:\s*(\d+)',
              r'Unconnected pads:\s*(\d+)',
          ):
              match = re.search(pattern, drc, re.I)
              if match:
                  unconnected = int(match.group(1))
                  break

          violations = None
          match = re.search(r'Found\s+(\d+)\s+DRC violations', drc, re.I)
          if match:
              violations = int(match.group(1))

          router_remaining = None
          for pattern in (
              r'(?:remaining|incomplete|unrouted)\s+(?:connection|trace|item)s?\s*[:=]?\s*(\d+)',
              r'(\d+)\s+(?:connection|trace|item)s?\s+(?:remaining|unrouted)',
          ):
              matches = list(re.finditer(pattern, log, re.I))
              if matches:
                  router_remaining = int(matches[-1].group(1))
                  break

          illegal_planes = [
              error for error in audit.get('errors', [])
              if error.startswith('SIGNALS_ON_GND_LAYER')
          ]
          summary = {
              'variant': root.name,
              'drc_violations': violations,
              'unconnected_pads': unconnected,
              'router_reported_remaining': router_remaining,
              'routing_audit_errors': audit.get('errors', []),
              'illegal_signal_plane_errors': illegal_planes,
              'fully_autorouted': (
                  violations == 0 and
                  unconnected == 0 and
                  not illegal_planes
              ),
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))

          with open(pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as stream:
              stream.write(f"## {root.name}\n\n")
              stream.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')

          if not summary['fully_autorouted']:
              raise SystemExit(1)
          PY

      - name: Upload complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoroute-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
