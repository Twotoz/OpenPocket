<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">OpenPocket</title>
  <desc id="desc">An ESP32-S3 handheld FPV controller with analog video, OpenPocket OSD, and an AMT630A display</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f1d"/>
      <stop offset="0.55" stop-color="#11152a"/>
      <stop offset="1" stop-color="#211437"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143250"/>
      <stop offset="1" stop-color="#20133b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9db2ce" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1120" height="320" rx="28" fill="url(#background)"/>
  <rect width="1120" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 276C170 220 330 310 515 254S835 205 1120 264V320H0Z" fill="#8b5cf6" opacity=".045"/>
  <path d="M0 286C185 240 350 316 522 269S824 220 1120 278" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="2"/>

  <g transform="translate(55 38)" filter="url(#shadow)">
    <path d="M46 26h190c18 0 31 13 34 31l18 135c3 22-13 42-35 42H29c-22 0-38-20-35-42L12 57c3-18 16-31 34-31Z" fill="#091523" stroke="#32435b" stroke-width="2"/>
    <rect x="64" y="48" width="154" height="91" rx="11" fill="url(#screen)" stroke="#6d5ca7" stroke-width="2"/>
    <path d="M76 71h40m-40 15h64m-64 15h50m76-30h-28m28 15h-42m42 15h-34" fill="none" stroke="#b8d9ef" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 126h104" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#101f31" stroke="#71839a" stroke-width="3">
      <circle cx="60" cy="180" r="31"/>
      <circle cx="222" cy="180" r="31"/>
    </g>
    <g stroke="#d4dfec" stroke-width="5" stroke-linecap="round">
      <path d="M60 162v36M42 180h36M222 162v36M204 180h36"/>
    </g>
    <g fill="#8b5cf6">
      <circle cx="122" cy="178" r="6"/>
      <circle cx="143" cy="178" r="6"/>
      <circle cx="164" cy="178" r="6"/>
    </g>
    <path d="M110 213h62" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M141 26V7" stroke="#71839a" stroke-width="6" stroke-linecap="round"/>
    <path d="M141 7c24-16 49-18 72-7M141 7c-24-16-49-18-72-7" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>

  <g transform="translate(375 58)">
    <text x="0" y="72" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">OpenPocket</text>
    <rect x="2" y="91" width="510" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="2" y="139" fill="#c4cede" font-family="Arial, Helvetica, sans-serif" font-size="24">Control, analog FPV, and OSD in one handheld.</text>
    <text x="2" y="171" fill="#c4cede" font-family="Arial, Helvetica, sans-serif" font-size="22">ESP32-S3 · RX5808 · AT7456E · AMT630A</text>

    <g transform="translate(2 201)" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">
      <rect width="112" height="34" rx="17" fill="#14263b" stroke="#38bdf8" stroke-opacity=".65"/>
      <text x="56" y="22" text-anchor="middle" fill="#7dd3fc">ESP32-S3</text>
      <rect x="126" width="132" height="34" rx="17" fill="#221b3d" stroke="#a78bfa" stroke-opacity=".65"/>
